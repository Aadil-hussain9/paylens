spring:
  datasource:
    url: ${PAYLENS_TEST_DATASOURCE_URL:${PAYLENS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paylens}}
    username: ${PAYLENS_DATASOURCE_USERNAME:paylens}
    password: ${PAYLENS_DATASOURCE_PASSWORD:paylens}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: false

paylens:
  employee:
    seed:
      enabled: false

logging:
  level:
    root: WARN
    com.incubyte.paylens: INFO




