# The `test` profile mirrors the automatic test classpath configuration:
# a Testcontainers-managed PostgreSQL container, real Flyway migrations,
# and `ddl-auto=validate` so the JPA mappings must match the migrated schema.
spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///paylens
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_schema: public
  flyway:
    enabled: true
    default-schema: public
    schemas: public
    locations: classpath:db/migration

paylens:
  employee:
    seed:
      enabled: false

logging:
  level:
    root: WARN
    com.incubyte.paylens: INFO




