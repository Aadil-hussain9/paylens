spring:
  datasource:
    url: ${PAYLENS_DATASOURCE_URL:jdbc:postgresql://postgres:5432/paylens}
    username: ${PAYLENS_DATASOURCE_USERNAME:paylens}
    password: ${PAYLENS_DATASOURCE_PASSWORD:paylens}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

paylens:
  employee:
    seed:
      enabled: ${PAYLENS_EMPLOYEE_SEED_ENABLED:false}

logging:
  level:
    root: INFO
    com.incubyte.paylens: INFO

